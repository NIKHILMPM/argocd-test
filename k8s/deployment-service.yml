apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: argocd-app
  template:
    metadata:
      labels:
        app: argocd-app
    spec:
      containers:
        - name: argocd-app
          image: YOUR_DOCKER_USERNAME/argocd-test-app:latest
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: argocd-app-service
spec:
  type: NodePort
  selector:
    app: argocd-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30007
